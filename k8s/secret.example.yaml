# TEMPLATE ONLY. Do not apply this file, and do not fill it in and commit it.
#
# There is deliberately no real or placeholder value here. A committed
# placeholder is how a "example" signing key ends up in production: someone
# applies the file to get things moving and never replaces it. The
# application also refuses to start on the .env.example placeholder for the
# same reason.
#
# Create the Secret imperatively instead, so the value only ever exists in
# the cluster and in your shell history:
#
#   kubectl create secret generic ledgerlock-secrets \
#     --namespace ledgerlock \
#     --from-literal=JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(64))')"
#
# scripts/verify_k8s.sh does exactly that.
#
# For anything beyond a local demonstration, the signing key belongs in a
# real secret manager (External Secrets Operator, Sealed Secrets, SOPS, or
# the cloud provider's own) rather than in a Kubernetes Secret, which is
# only base64-encoded at rest unless encryption-at-rest is configured on
# etcd.
apiVersion: v1
kind: Secret
metadata:
  name: ledgerlock-secrets
  namespace: ledgerlock
  labels:
    app.kubernetes.io/name: ledgerlock
type: Opaque
stringData:
  # Replace via the kubectl command above. Left empty on purpose: applying
  # this file as-is produces a Secret the application will reject at startup,
  # which is the intended failure mode.
  JWT_SECRET_KEY: ""
