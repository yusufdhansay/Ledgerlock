# One-shot Job that initiates the replica set.
#
# Needed because MongoDB does not self-initiate: a mongod started with
# `--replSet` sits as an uninitiated member, accepting connections but
# refusing writes and transactions, until someone calls `rs.initiate()`.
# Without this Job the API would start, fail its readiness check because
# there is no writable primary, and correctly stay out of service forever.
#
# The member is registered under the pod's stable StatefulSet DNS name, so
# the address the replica set advertises is the address clients can actually
# resolve. Getting this wrong is the classic failure: the set initiates with
# an internal pod IP or `localhost`, drivers follow the advertised address,
# and connections fail from everywhere except inside that one pod.
#
# Idempotent, so re-applying it after a restart is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: ledgerlock-mongo-init
  namespace: ledgerlock
  labels:
    app.kubernetes.io/name: ledgerlock
    app.kubernetes.io/component: mongo-init
spec:
  backoffLimit: 12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledgerlock
        app.kubernetes.io/component: mongo-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:7.0
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              HOST="ledgerlock-mongo-0.ledgerlock-mongo.ledgerlock.svc.cluster.local"

              echo "waiting for mongod at ${HOST} to answer..."
              for attempt in $(seq 1 60); do
                if mongosh --quiet --host "${HOST}" --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
                  echo "mongod is answering (attempt ${attempt})"
                  break
                fi
                sleep 3
              done

              echo "initiating replica set rs0 if it is not already initiated..."
              mongosh --quiet --host "${HOST}" --eval "
                try {
                  const status = rs.status();
                  print('replica set already initiated: ' + status.set);
                } catch (err) {
                  print('initiating: ' + err.codeName);
                  rs.initiate({
                    _id: 'rs0',
                    members: [{ _id: 0, host: '${HOST}:27017' }]
                  });
                }
              "

              echo "waiting for a writable primary..."
              for attempt in $(seq 1 60); do
                if mongosh --quiet --host "${HOST}" \
                     --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"; then
                  echo "primary is writable after ${attempt} attempt(s)"
                  mongosh --quiet --host "${HOST}" --eval "
                    const s = rs.status();
                    print('set=' + s.set);
                    s.members.forEach(m => print('member=' + m.name + ' state=' + m.stateStr));
                  "
                  exit 0
                fi
                sleep 3
              done

              echo "ERROR: replica set never reported a writable primary" >&2
              exit 1
